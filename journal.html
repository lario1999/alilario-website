<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Journal | Ali Lario</title>


    <link
        rel="icon"
        href="assets/icons/favicon.ico">


    <!-- ==================================================
         GOOGLE FONT
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">


    <!-- ==================================================
         SHARED PROJECT STYLES
    ================================================== -->

    <link
        rel="stylesheet"
        href="assets/css/projects.css">


    <!-- ==================================================
         JOURNAL STYLES
    ================================================== -->

    <link
        rel="stylesheet"
        href="assets/css/journal.css">

</head>


<body>


<!-- ======================================================
     MOBILE / TABLET HEADER
     Desktop: hidden by CSS
====================================================== -->

<header class="mobile-header">


    <a
        href="index.html"
        class="mobile-brand">

        Ali Lario

    </a>


    <button
        class="mobile-menu-button"
        id="mobile-menu-button"
        type="button"
        aria-label="Open menu"
        aria-controls="mobile-menu"
        aria-expanded="false">

        ☰

    </button>


</header>



<!-- ======================================================
     PAGE
====================================================== -->

<div class="page">


    <!-- ==================================================
         DESKTOP SIDEBAR
         🔒 EXISTING DESKTOP STRUCTURE
    =================================================== -->

    <aside class="sidebar">


        <div>


            <!-- ==========================================
                 BRAND
            =========================================== -->

            <a
                href="index.html"
                class="brand">


                <h1>

                    Ali Lario

                </h1>


                <div class="divider"></div>


                <p>

                    Photography &amp; Videography

                </p>


            </a>



            <!-- ==========================================
                 DESKTOP NAVIGATION
            =========================================== -->

            <nav class="sidebar-nav">


                <a href="projects.html">

                    Projects

                </a>


                <a
                    href="journal.html"
                    class="active">

                    Journal

                </a>


                <a href="about.html">

                    About

                </a>


                <a href="contact.html">

                    Contact

                </a>


            </nav>


        </div>



        <!-- ==========================================
             DESKTOP COPYRIGHT
        =========================================== -->

        <footer>

            © 2026 Ali Lario

            <br>

            All Rights Reserved.

        </footer>


    </aside>



    <!-- ==================================================
         MAIN CONTENT
    =================================================== -->

    <main class="content">


        <!-- ==========================================
             JOURNAL GALLERY
        =========================================== -->

        <section
            class="projects-gallery"
            id="journal-gallery">

            <!-- Journal cards generated by journal.js -->

        </section>


    </main>


</div>



<!-- ======================================================
     MOBILE / TABLET MENU
     Desktop: hidden by CSS
====================================================== -->

<div
    class="mobile-menu"
    id="mobile-menu"
    aria-hidden="true">


    <!-- ==========================================
         CLOSE
    =========================================== -->

    <button
        class="mobile-menu-close"
        id="mobile-menu-close"
        type="button"
        aria-label="Close menu">

        ×

    </button>



    <!-- ==========================================
         NAVIGATION
    =========================================== -->

    <nav class="mobile-menu-nav">


        <a href="projects.html">

            Architecture

        </a>


        <a href="projects.html">

            Corporate

        </a>


        <a href="projects.html">

            Wedding

        </a>


        <a
            href="journal.html"
            class="active">

            Journal

        </a>


        <a href="about.html">

            About

        </a>


        <a href="contact.html">

            Contact

        </a>


    </nav>



    <!-- ==========================================
         COPYRIGHT
    =========================================== -->

    <div class="mobile-menu-footer">

        © 2026 Ali Lario

        <br>

        All Rights Reserved.

    </div>


</div>



<!-- ======================================================
     JOURNAL VIEWER
====================================================== -->

<div
    class="viewer"
    id="viewer"
    aria-hidden="true">


    <!-- ==========================================
         BACKDROP
    =========================================== -->

    <div class="viewer-backdrop"></div>



    <!-- ==========================================
         VIEWER CONTAINER
    =========================================== -->

    <div class="viewer-container">


        <!-- ======================================
             CLOSE
        ======================================= -->

        <button
            class="viewer-close"
            id="viewer-close"
            type="button"
            aria-label="Close">

            ×

        </button>



        <!-- ======================================
             VIEWER CONTENT
        ======================================= -->

        <div class="viewer-content">


            <!-- ==================================
                 GALLERY
            =================================== -->

            <section
                class="viewer-gallery"
                id="viewer-gallery">

                <!-- Images injected by journal.js -->

            </section>



            <!-- ==================================
                 INFORMATION
            =================================== -->

            <aside class="viewer-info">


                <div class="info-wrapper">


                    <h1
                        id="viewer-title">
                    </h1>



                    <div class="info-block">


                        <p
                            id="viewer-story">
                        </p>


                    </div>


                </div>


            </aside>


        </div>


    </div>


</div>



<!-- ======================================================
     JAVASCRIPT
====================================================== -->

<script
    src="assets/js/journal-data.js">
</script>

<script
    src="assets/js/journal.js">
</script>


</body>

</html>
